# Approved reference documentation sets (design section 6.3.1).
#
# Only the URLs and repositories listed here are contacted by cf-refmirror.
# Change this file only through a pull request approved by a tech lead.
# Every remote source must carry the sha256 of the approved artifact; a
# mismatch stops the set and alerts the owner.
#
# The entries below are the design's examples; fill in the real URLs and
# checksums before the first production mirroring run.
sets:
  - id: boost
    version: "1.89.0"
    source: https://archives.boost.io/release/1.89.0/source/boost_1_89_0.tar.bz2
    extract: ["doc/html", "libs/*/doc/html"]
    sha256: "85a33fa22621b4f314f8e85e1a5e2a9363d22e4f4992925d4bb3bc631b5a0c7a"
    license: BSL-1.0
  - id: nlohmann-json
    version: "3.12.0"
    generate: doxygen
    repo: https://github.com/nlohmann/json
    ref: v3.12.0
    license: MIT
