# Company Semgrep starter rules for Python (design section 6.7.2).
# Only rules whose IDs start with `swt.` are company rules.
rules:
  - id: swt.python.no-shell-true
    languages: [python]
    severity: ERROR
    message: Do not pass shell=True to subprocess; build an argument list instead.
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: swt.python.no-verify-false
    languages: [python]
    severity: ERROR
    message: Do not disable TLS certificate verification.
    pattern: requests.$FUNC(..., verify=False, ...)

  - id: swt.python.no-unsafe-yaml-load
    languages: [python]
    severity: ERROR
    message: Use yaml.safe_load or an explicit SafeLoader for untrusted YAML.
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)

  - id: swt.python.no-os-system
    languages: [python]
    severity: ERROR
    message: Do not invoke a shell through os.system; use subprocess with an argument list.
    pattern: os.system(...)

  - id: swt.python.no-weak-hash
    languages: [python]
    severity: ERROR
    message: Do not use MD5 or SHA-1 for security-sensitive hashing.
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

  - id: swt.python.no-pickle-load
    languages: [python]
    severity: ERROR
    message: Do not deserialize untrusted pickle data; use a safe data format.
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)

  - id: swt.python.no-eval
    languages: [python]
    severity: ERROR
    message: Do not execute dynamic Python code with eval or exec.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: swt.python.no-sleep-in-test
    languages: [python]
    severity: ERROR
    message: Do not sleep in tests; inject a clock or synchronize explicitly.
    paths:
      include:
        - "**/tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
    pattern-either:
      - pattern: time.sleep(...)
      - pattern: asyncio.sleep(...)

  - id: swt.python.no-hardcoded-secret
    languages: [python]
    severity: ERROR
    message: Do not hardcode credentials or tokens; read them at runtime.
    patterns:
      - pattern-either:
          - pattern: $NAME = "..."
          - pattern: $NAME = '...'
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)(password|passwd|secret|token|api_key|apikey|private_key)

  - id: swt.python.no-tempfile-mktemp
    languages: [python]
    severity: ERROR
    message: Do not use tempfile.mktemp; it has a race. Use NamedTemporaryFile or mkstemp.
    pattern: tempfile.mktemp(...)

  - id: swt.python.no-unverified-ssl-context
    languages: [python]
    severity: ERROR
    message: Do not create an SSL context with certificate verification disabled.
    pattern: ssl._create_unverified_context(...)
