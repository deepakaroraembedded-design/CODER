# Company Semgrep starter rules for Java (design section 6.7.2).
rules:
  - id: swt.java.no-runtime-exec
    languages: [java]
    severity: ERROR
    message: Do not execute OS commands through Runtime.exec; use a vetted API.
    pattern: $RUNTIME.exec(...)

  - id: swt.java.no-print-stack-trace
    languages: [java]
    severity: ERROR
    message: Log structured errors with context instead of printStackTrace().
    pattern: $EXCEPTION.printStackTrace()

  - id: swt.java.no-weak-hash
    languages: [java]
    severity: ERROR
    message: Do not use MD5 or SHA-1 for security-sensitive hashing.
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA-1")

  - id: swt.java.no-object-deserialization
    languages: [java]
    severity: ERROR
    message: Do not deserialize untrusted object streams; use a safe data format.
    pattern: new ObjectInputStream(...)

  - id: swt.java.no-sleep-in-test
    languages: [java]
    severity: ERROR
    message: Do not sleep in tests; inject a clock or synchronize explicitly.
    paths:
      include:
        - "**/src/test/**"
    pattern: Thread.sleep(...)

  - id: swt.java.no-hardcoded-secret
    languages: [java]
    severity: ERROR
    message: Do not hardcode credentials or tokens; read them at runtime.
    patterns:
      - pattern: $NAME = "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)(password|passwd|secret|token|api_key|apikey|private_key)

  - id: swt.java.no-insecure-random
    languages: [java]
    severity: ERROR
    message: Do not use java.util.Random for security-sensitive values; use SecureRandom.
    pattern: new java.util.Random(...)
