# Company Semgrep starter rules for TypeScript (design section 6.7.2).
rules:
  - id: swt.typescript.no-eval
    languages: [typescript]
    severity: ERROR
    message: Do not use eval; parse or validate the input explicitly.
    pattern: eval(...)

  - id: swt.typescript.no-direct-html
    languages: [typescript]
    severity: ERROR
    message: Do not assign untrusted HTML to innerHTML/outerHTML; use a safe DOM API.
    patterns:
      - pattern-either:
          - pattern: $ELEMENT.innerHTML = $VALUE
          - pattern: $ELEMENT.outerHTML = $VALUE
      - pattern-not: $ELEMENT.innerHTML = "..."
      - pattern-not: $ELEMENT.innerHTML = '...'
      - pattern-not: $ELEMENT.outerHTML = "..."
      - pattern-not: $ELEMENT.outerHTML = '...'

  - id: swt.typescript.no-sleep-in-test
    languages: [typescript]
    severity: ERROR
    message: Do not sleep in tests; inject a clock or synchronize explicitly.
    paths:
      include:
        - "**/tests/**"
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "**/*.test.js"
        - "**/*.spec.js"
    pattern: setTimeout(...)

  - id: swt.typescript.no-weak-hash
    languages: [typescript]
    severity: ERROR
    message: Do not use MD5 or SHA-1 for security-sensitive hashing.
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")

  - id: swt.typescript.no-document-write
    languages: [typescript]
    severity: ERROR
    message: Do not write raw content with document.write; use a safe DOM API.
    pattern: document.write(...)

  - id: swt.typescript.no-hardcoded-secret
    languages: [typescript]
    severity: ERROR
    message: Do not hardcode credentials or tokens; read them at runtime.
    patterns:
      - pattern-either:
          - pattern: $NAME = "..."
          - pattern: $NAME = '...'
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)(password|passwd|secret|token|api_key|apikey|private_key)
