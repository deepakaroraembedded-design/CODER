# Company Semgrep starter rules for Go (design section 6.7.2).
rules:
  - id: swt.go.no-shell-command
    languages: [go]
    severity: ERROR
    message: Do not invoke a shell with exec.Command; pass an argument list.
    pattern: exec.Command("sh", "-c", ...)

  - id: swt.go.no-insecure-skip-verify
    languages: [go]
    severity: ERROR
    message: Do not disable TLS certificate verification.
    pattern: "tls.Config{..., InsecureSkipVerify: true, ...}"

  - id: swt.go.no-sleep-in-test
    languages: [go]
    severity: ERROR
    message: Do not sleep in tests; synchronize explicitly or inject a clock.
    paths:
      include:
        - "**/*_test.go"
    pattern: time.Sleep(...)

  - id: swt.go.no-weak-hash
    languages: [go]
    severity: ERROR
    message: Do not use MD5 or SHA-1 for security-sensitive hashing.
    pattern-either:
      - pattern: md5.New(...)
      - pattern: sha1.New(...)

  - id: swt.go.no-hardcoded-secret
    languages: [go]
    severity: ERROR
    message: Do not hardcode credentials or tokens; read them at runtime.
    patterns:
      - pattern-either:
          - pattern: $NAME := "..."
          - pattern: $NAME = "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)(password|passwd|secret|token|api_key|apikey|private_key)
