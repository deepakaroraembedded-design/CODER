name: ci

on:
  push:
  pull_request:

env:
  VCPKG_DISABLE_METRICS: "1"

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++-13
            echo "CXX=g++-13" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y clang-18
            echo "CXX=clang++-18" >> "$GITHUB_ENV"
          fi

      - name: Cache vcpkg downloads and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            third_party/vcpkg/downloads
          key: vcpkg-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json') }}

      - name: Set up vcpkg at the pinned baseline
        run: |
          git clone https://github.com/microsoft/vcpkg third_party/vcpkg
          git -C third_party/vcpkg checkout e456309491fd875487bf02b8a0dca76c1b1b00cc
          third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

  sanitizers:
    name: gcc / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Cache vcpkg downloads and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            third_party/vcpkg/downloads
          key: vcpkg-gcc-${{ hashFiles('vcpkg.json') }}

      - name: Set up vcpkg at the pinned baseline
        run: |
          git clone https://github.com/microsoft/vcpkg third_party/vcpkg
          git -C third_party/vcpkg checkout e456309491fd875487bf02b8a0dca76c1b1b00cc
          third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} -j"$(nproc)"

      - name: Lower ASLR entropy for TSan
        if: ${{ matrix.preset == 'tsan' }}
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

  # The harness compatibility suite (tests/harness_compat, scenarios H1-H15,
  # design section 6.6.2) must pass against every candidate opencode version
  # before it is pinned. It needs a model provider key and the pinned opencode
  # binary, so it runs here only when the repository secret is configured.
  harness-compat:
    name: harness compatibility (H1-H15)
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13 curl
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Set up vcpkg at the pinned baseline
        run: |
          git clone https://github.com/microsoft/vcpkg third_party/vcpkg
          git -C third_party/vcpkg checkout e456309491fd875487bf02b8a0dca76c1b1b00cc
          third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure and build
        run: |
          cmake --preset debug
          cmake --build build/debug -j"$(nproc)"

      - name: Install pinned opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run H1-H15 (20 runs each)
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        run: |
          ./build/debug/cf-harness-spike \
            --mcp "$PWD/build/debug/cf-mcp-spike" \
            --runs 20 --timeout 240
