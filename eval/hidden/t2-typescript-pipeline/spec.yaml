# Hidden cross-component acceptance tests for the T2 TypeScript pipeline.
compile:
  - name: install
    argv: [npm, install, --no-audit, --no-fund]
  - name: build
    argv: [npm, run, build]
tests:
  - name: contract
    argv:
      - node
      - "{hidden}/pipeline_check.js"
      - "{worktree}/dist/parser.js"
      - "{worktree}/dist/aggregate.js"
