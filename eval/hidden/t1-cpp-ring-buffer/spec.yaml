# Hidden acceptance tests for the T1 C++ ring buffer (design section 17.2).
#
# Compile and run against the integration worktree; the test programs print
# their per-case counts as a final {"tests": N, "passed": M} line.
compile:
  - name: semantics
    argv:
      - g++
      - -std=c++20
      - -Wall
      - -Wextra
      - -O1
      - -I
      - "{worktree}/include"
      - "{hidden}/ring_buffer_test.cpp"
      - -o
      - "{build}/ring_buffer_test"
  - name: tsan
    argv:
      - g++
      - -std=c++20
      - -fsanitize=thread
      - -O1
      - -pthread
      - -I
      - "{worktree}/include"
      - "{hidden}/ring_buffer_tsan_test.cpp"
      - -o
      - "{build}/ring_buffer_tsan_test"
tests:
  - name: semantics
    argv: ["{build}/ring_buffer_test"]
  - name: tsan-concurrency
    disable_aslr: true
    argv: ["{build}/ring_buffer_tsan_test"]
