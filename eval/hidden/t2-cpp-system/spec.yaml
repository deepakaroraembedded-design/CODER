# Hidden cross-component acceptance tests for the T2 C++ pipeline.
compile:
  - name: compile
    argv:
      - g++
      - -std=c++20
      - -Wall
      - -Wextra
      - -Werror
      - -I
      - "{worktree}/include"
      - "{hidden}/SystemTest.cpp"
      - -o
      - "{build}/system_test"
tests:
  - name: contract
    argv: ["{build}/system_test"]
