# Hidden acceptance tests for the repeated mid-turn crash scenario (design
# sections 6.12.3, 6.12.5, 17.2). The runner SIGKILLs the process mid-turn,
# recovers, kills the continuation again and finishes; the checks verify the
# deliverable and that recovery duplicated nothing.
recovery: true
crash_after_seconds: 75
crash_count: 2
compile:
  - name: contract
    argv:
      - g++
      - -std=c++20
      - -Wall
      - -Wextra
      - -O1
      - -I
      - "{worktree}/include"
      - "{hidden}/counter_test.cpp"
      - -o
      - "{build}/counter_test"
tests:
  - name: contract
    argv: ["{build}/counter_test"]
  - name: recovery
    argv: [python3, "{hidden}/recovery_check.py", --run-dir, "{run_dir}", --worktree, "{worktree}"]
