# Hidden acceptance tests for the T1 Python config loader (design section
# 17.2). Compile checks the package byte-compiles; the contract test runs the
# self-contained check script, which prints its per-case counts as a final
# {"tests": N, "passed": M} line.
compile:
  - name: syntax
    argv: [python3, -m, compileall, -q, "{worktree}/src"]
tests:
  - name: config-contract
    argv: [python3, "{hidden}/config_loader_check.py", --worktree, "{worktree}"]
