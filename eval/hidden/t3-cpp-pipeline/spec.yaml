# Hidden acceptance tests for the T3 pipeline plan (design section 17.2).
# The contract test compiles and runs against the integration worktree; the
# test program prints its per-case counts as a final {"tests": N, "passed": M}
# line.
compile:
  - name: contract
    argv:
      - g++
      - -std=c++20
      - -Wall
      - -Wextra
      - -O1
      - -I
      - "{worktree}/include"
      - "{hidden}/pipeline_test.cpp"
      - -o
      - "{build}/pipeline_test"
tests:
  - name: contract
    argv: ["{build}/pipeline_test"]
