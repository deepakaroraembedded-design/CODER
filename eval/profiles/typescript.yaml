# TypeScript/JavaScript toolchain profile for the golden benchmark on a bare host.
id: typescript-bench
image: cf-toolchain-typescript:2026.10
codeintel_backend: tree-sitter

languages:
  typescript:
    standard_var: NODE_VERSION
  javascript:
    standard_var: NODE_VERSION

build_systems:
  npm:
    steps:
      - [npm, install, --no-audit, --no-fund]
      - [npm, run, build]
    agent_commands: [npm, npx]
  pnpm:
    steps:
      - [pnpm, install, --frozen-lockfile]
      - [pnpm, run, build]
    agent_commands: [pnpm, npx]

test_frameworks:
  vitest: { steps: [[npx, vitest, run, --globals]], languages: [typescript, javascript] }
  jest: { steps: [[npx, jest, --ci]], languages: [typescript, javascript] }

exec_from_source: []
