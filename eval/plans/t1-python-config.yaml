# Golden plan: layered configuration loader (T1, Python; held out).
plan_id: GOLD-T1-PY-CONFIG
product: golden
version: 1.0
milestones:
  - id: M1
    title: Config loader with defaults, file and environment layers
    requirements: [REQ-CFG-1]
    acceptance:
      - "Provide a Python package at src/config_loader (src/config_loader/__init__.py) exposing load_config(defaults=None, path=None, env=None) -> Config, plus ConfigError; standard library only"
      - "Config is a dict subclass with every merged key and an unknown_keys attribute: the sorted keys that came from the file but are not in the defaults layer"
      - "Layers merge in order defaults < file < environment; a later layer overrides an earlier one, so environment wins"
      - "The file layer is a JSON object at path; path=None skips it; a key from the file that is not in defaults is kept in the result and listed in unknown_keys"
      - "A malformed file (invalid JSON, or valid JSON that is not an object) raises ConfigError whose message contains the path, never a bare traceback"
target:
  language: python
  standard: "3.12"
  build_system: pyproject
  test_framework: pytest
  platforms: [linux-x86_64]
models:
  coder: deepseek
  reviewer: kimi
  qa: glm
inference: fireworks
budget:
  max_usd_total: 20
  max_wall_clock_hours: 6
