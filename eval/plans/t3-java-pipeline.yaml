# Golden plan: three-component Java order pipeline (T3).
plan_id: GOLD-T3-JAVA-PIPELINE
product: golden
version: 1.0
milestones:
  - id: M1
    title: Represent money and line items
    requirements: [REQ-JAVA-PIPE-1]
    writes: [pom.xml, src/main/java/cf_golden/Money.java, src/main/java/cf_golden/LineItem.java]
    uses: []
    writes_interfaces: [src/main/java/cf_golden/Money.java, src/main/java/cf_golden/LineItem.java]
    acceptance:
      - "Java 17 records Money(long cents) and LineItem(String sku, int quantity, Money unitPrice)"
      - "Money.add, Money.multiply and Money.isNegative are available"
      - "Invalid negative money or non-positive quantity is rejected with IllegalArgumentException"
  - id: M2
    title: Apply line items to an order ledger
    requirements: [REQ-JAVA-PIPE-2]
    depends_on: [M1]
    writes: [src/main/java/cf_golden/Ledger.java]
    uses: [src/main/java/cf_golden/Money.java, src/main/java/cf_golden/LineItem.java]
    writes_interfaces: [src/main/java/cf_golden/Ledger.java]
    acceptance:
      - "Ledger records line items and exposes total() and itemCount()"
      - "total multiplies quantity by unit price with overflow checked"
  - id: M3
    title: Process an order and reject invalid transitions
    requirements: [REQ-JAVA-PIPE-3]
    depends_on: [M2]
    writes: [src/main/java/cf_golden/OrderProcessor.java]
    uses: [src/main/java/cf_golden/Ledger.java]
    writes_interfaces: [src/main/java/cf_golden/OrderProcessor.java]
    acceptance:
      - "OrderProcessor.process(List<LineItem>) returns an immutable Ledger and total"
      - "Processing an empty order returns a zero-total ledger; duplicate SKUs remain distinct line items"
      - "mvn -q test succeeds and all three components compile with Java 17"
target:
  language: java
  standard: "17"
  build_system: maven
  test_framework: junit5
  platforms: [linux-x86_64]
constraints:
  forbidden: ["raw types", "external dependencies beyond JUnit"]
models:
  coder: deepseek
  reviewer: kimi
  qa: glm
inference: fireworks
budget:
  max_usd_total: 40
  max_wall_clock_hours: 10
