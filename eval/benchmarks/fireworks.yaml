# Phase 0b model benchmark (design sections 17.2, 18.2).
#
# Runs the first evaluation plans through the real run pipeline against
# Fireworks candidates and picks the exact model versions to pin in
# third_party/VERSIONS (design D11: benchmark-only selection with no
# defaults). Start small: one C++ T1 plan, one candidate, then widen.
#
#   cf-eval bench --suite eval/suite.yaml \
#                 --benchmark eval/benchmarks/fireworks.yaml \
#                 --workspace bench-work --out bench-out \
#                 --mcp build/debug/cf-mcp --profiles eval/profiles \
#                 --candidate fireworks-default --plan t1-cpp-ring-buffer
#
# --profiles eval/profiles keeps only host-runnable gate steps (build/tests);
# the full profiles/c-cpp.yaml format, guardrail and analysis steps need the
# cf-toolchain-c-cpp sandbox image. Use the full profile when the bench runs
# against that image.
#
# Prices are per million tokens, from the opencode models catalog. opencode
# reports cost 0 for these custom provider model entries, so the benchmark
# estimates cost from this table (usage-<role>.jsonl carries the token
# counts).
#
# `options` are opencode model options written verbatim into the role's config
# (camelCase, as opencode expects). reasoningEffort: low keeps the reasoning
# models from spending a whole turn thinking without acting; the benchmark can
# compare efforts the same way it compares model ids.
benchmark: cf-bench-phase0b
provider_base_url: https://api.fireworks.ai/inference/v1
api_key_env: FIREWORKS_API_KEY
repeats: 1
plans: [t1-cpp-ring-buffer, t2-cpp-registry, t3-cpp-pipeline, sec-injection-comments, t1-python-config, t1-go-lru, rel-orchestrator-crash, rel-crash-mid-turn]
candidates:
  - name: fireworks-default
    roles:
      coder: accounts/fireworks/models/deepseek-v4p1-flash
      reviewer: accounts/fireworks/models/kimi-k3
      qa: accounts/fireworks/models/glm-5p3
    options:
      coder: {reasoningEffort: low}
      reviewer: {reasoningEffort: low}
      qa: {reasoningEffort: low}
  - name: qa-glm-flash
    roles:
      coder: accounts/fireworks/models/deepseek-v4p1-flash
      reviewer: accounts/fireworks/models/kimi-k3
      qa: accounts/fireworks/models/glm-5p3-flash
    options:
      coder: {reasoningEffort: low}
      reviewer: {reasoningEffort: low}
      qa: {reasoningEffort: low}
  - name: reviewer-kimi-fast
    roles:
      coder: accounts/fireworks/models/deepseek-v4p1-flash
      reviewer: accounts/fireworks/routers/kimi-k3-fast
      qa: accounts/fireworks/models/glm-5p3
    options:
      coder: {reasoningEffort: low}
      reviewer: {reasoningEffort: low}
      qa: {reasoningEffort: low}
prices:
  accounts/fireworks/models/deepseek-v4p1-flash: {in: 0.3, out: 1.2}
  accounts/fireworks/models/kimi-k3: {in: 3.0, out: 15.0}
  accounts/fireworks/models/glm-5p3: {in: 1.4, out: 4.4}
  accounts/fireworks/models/glm-5p3-flash: {in: 0.15, out: 0.5}
  accounts/fireworks/routers/kimi-k3-fast: {in: 4.5, out: 22.5}
