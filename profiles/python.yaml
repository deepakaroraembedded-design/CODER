# Python toolchain profile (design section 6.7.1 and 6.7.2).
#
# Trusted commands only: each step is an argument list executed with no shell.
# Placeholders: {src_dir}, {build_dir}, {standard}, {standard_number},
# {standard_var} and {changed_files...} (expanded one argument per file).
#
# The format, guardrail and analysis tools (ruff, semgrep, bandit) live in the
# cf-toolchain-python sandbox image; the bare-host variant used by the golden
# benchmark is eval/profiles/python.yaml.
id: python
image: cf-toolchain-python:2026.10
codeintel_backend: tree-sitter

languages:
  python:
    standard_var: PYTHON_VERSION
    guardrails:
      steps:
        - [semgrep, --config, rules/semgrep/python.yaml, --error, "{changed_files...}"]
    format:
      steps:
        - [ruff, format, --check, "{changed_files...}"]

build_systems:
  pyproject:
    steps:
      - [mypy, --strict, "{src_dir}/src"]
    agent_commands: [python3, pytest]
  setuptools:
    steps:
      - [mypy, --strict, "{src_dir}/src"]
    agent_commands: [python3, pytest]

test_frameworks:
  pytest: { steps: [[python3, -m, pytest, "{src_dir}/tests", -q]], report: junit, languages: [python] }

common:
  analysis:
    steps:
      - [bandit, -q, -r, "{src_dir}/src"]
      - [ruff, check, "{src_dir}/src"]
  coverage: { tool: coverage.py, line: 0.85, branch: 0.75 }
  mutation: { tool: mutmut, min_score: 0.60 }

exec_from_source: []
